[tool.poetry]
name = "bk-reports-backend"
version = "0.1.0"
description = ""
authors = ["tembz <ap11dlayt@gmail.com>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.13,<3.15"
aiogram = "^3.25.0"
sqlalchemy = "^2.0.46"
asyncpg = "^0.31.0"
greenlet = "^3.3.1"
fastapi = "^0.128.7"
uvicorn = "^0.40.0"
requests = "^2.32.5"
